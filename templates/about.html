<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>About Atmos</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{{ 'dark-theme' if request.cookies.get('theme') != 'light' else 'light-theme' }}">
    <div class="background-gradient"></div>
    <div class="app-container" style="justify-content: center; align-items: center;">
        <div class="glass-panel" style="padding: 4rem; max-width: 600px; text-align: center;">
            <i class="fa-solid fa-cloud-sun-rain" style="font-size: 4rem; color: var(--primary-color); margin-bottom: 1rem;"></i>
            <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">About Atmos</h1>
            <p style="font-size: 1.1rem; line-height: 1.6; margin-bottom: 2rem;">
                Atmos is a premium weather dashboard built with Flask and Python. It provides real-time weather data, beautiful dynamic backgrounds based on the location, interactive maps, and 5-day forecasts.
            </p>
            <a href="/" style="display: inline-block; padding: 12px 24px; background: var(--primary-color); color: white; text-decoration: none; border-radius: 30px; font-weight: 500;">Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
